# Publishes the portfolio to GitHub Pages on every push to main, or on demand from the Actions tab.
# The tests and lint run first: a build that fails either one is never deployed.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild every morning (UTC) so the asteroid data on the page stays current.
  schedule:
    - cron: '17 9 * * *'

# One deployment at a time. A newer push waits for the one in progress instead of cutting it off.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      # Pull this week's asteroids from NASA into public/data/neows.json. The key is a repo secret and
      # is only read here, at build time. A failed fetch never fails the deploy: the page shows a notice.
      - run: node scripts/fetch-neows.mjs
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
      # Pull my newest public commits into public/data/commits.json for the animated background. The
      # token is the one GitHub gives every run, only here to lift the API rate limit. Like the step
      # above, a failure never fails the deploy: the background just has no commits.
      - run: node scripts/fetch-commits.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
      # vite.config.js uses relative paths, so the build works at the site root as is.
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the site
      id-token: write # prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
