<title>FireLordRay — the burning crown</title>
<desc>A bronze crown seen from slightly above so its band reads as an ellipse in perspective, with tongues of fire rising from the whole circumference: dark deep-ember flames behind the band, hotter amber flames in front of it, and embers drifting above a near-black ground.</desc>
